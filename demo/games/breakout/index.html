<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>打方块 · Breakout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 0%, #1b2a4a 0%, #0a0f1e 60%, #05070f 100%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e8eefc;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    position: relative;
    box-shadow: 0 0 60px rgba(80,140,255,0.25);
    border-radius: 14px;
  }
  canvas {
    display: block;
    width: min(96vw, 640px);
    max-height: 92vh;
    height: auto;
    aspect-ratio: 640 / 720;
    border-radius: 14px;
    background: linear-gradient(180deg, #0c1326 0%, #070b16 100%);
    cursor: none;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(6,10,22,0.78);
    backdrop-filter: blur(4px);
    border-radius: 14px;
    gap: 18px;
    padding: 30px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 46px;
    letter-spacing: 4px;
    background: linear-gradient(90deg,#5ad1ff,#7c8bff,#c77bff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(120,150,255,0.4);
  }
  #overlay p { color: #9fb0d0; line-height: 1.7; font-size: 15px; max-width: 380px; }
  #overlay .big { font-size: 22px; color: #ffd86b; }
  .btn {
    margin-top: 6px;
    padding: 12px 38px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #06203a;
    background: linear-gradient(90deg,#56d6ff,#8a7bff);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 6px 20px rgba(90,140,255,0.45);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(90,140,255,0.6); }
  .btn:active { transform: translateY(0); }
  .keyhint { display:flex; gap:10px; margin-top:4px; }
  .keyhint span {
    font-size:12px; color:#8aa0c8;
    border:1px solid #2c3c5e; border-radius:6px; padding:3px 9px;
  }
  #hud {
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between;
    padding:14px 22px; font-size:16px; letter-spacing:1px;
    pointer-events:none; color:#cfe0ff;
  }
  #hud b { color:#ffd86b; }
  .heart { color:#ff6b8b; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="640" height="720"></canvas>
  <div id="hud">
    <div>分数 <b id="score">0</b></div>
    <div>关卡 <b id="level">1</b></div>
    <div>生命 <span id="lives" class="heart">♥♥♥</span></div>
  </div>
  <div id="overlay">
    <h1>打 方 块</h1>
    <p>移动挡板接住小球，让小球把上面的方块全部弹掉！<br>方块会一颗颗消失，全部清完就过关。</p>
    <div class="keyhint"><span>鼠标/触屏 移动</span><span>点击/空格 发射</span><span>暂停 P</span></div>
    <button class="btn" id="startBtn">开 始 游 戏</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');

  // ---------- 音效 (WebAudio 简单蜂鸣) ----------
  let audioCtx = null;
  let beepBudget = 0;     // 每帧允许的音效次数，防止多球连撞时海量振荡器卡死主线程
  let beepLast = 0;
  function beep(freq, dur, type='square', vol=0.05) {
    if (beepBudget <= 0) return;                  // 本帧预算用尽直接跳过
    const now = performance.now();
    if (now - beepLast < 16) return;              // 同一时刻太密集也跳过，避免爆音+卡顿
    beepBudget--;
    beepLast = now;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  // ---------- 游戏状态 ----------
  const STATE = { MENU:0, READY:1, PLAY:2, PAUSE:3, OVER:4, WIN:5 };
  let state = STATE.MENU;
  let score = 0, level = 1, lives = 3;

  // ---------- 挡板 ----------
  const paddle = { w: 110, h: 16, x: W/2 - 55, y: H - 40, speed: 9, color:'#5ad1ff' };
  const PADDLE_W_BASE = 110;
  let paddleWideUntil = 0;

  // ---------- 小球 ----------
  const BALL_R = 8;
  const BALL_SPEED = 11;
  let balls = [];
  function makeBall(x, y, vx, vy) {
    return { x, y, r: BALL_R, vx, vy, speed: BALL_SPEED, trail: [] };
  }

  // ---------- 方块 ----------
  const brickCfg = { rows: 5, cols: 10, top: 70, gap: 6, h: 26, sideW: 24 };
  let bricks = [];
  const palette = ['#ff6b8b','#ffa86b','#ffd86b','#7bff9e','#5ad1ff','#8a7bff','#c77bff'];

  // ---------- 道具 ----------
  const powerups = [];
  const POWER_TYPES = [
    { type:'multi', color:'#5ad1ff', label:'✦', weight:50 }, // 分身：每个球裂成 3 个
    { type:'mega',  color:'#ffd86b', label:'✸', weight:24 }, // 狂暴分身：每个球裂成 5 个
    { type:'wide',  color:'#7bff9e', label:'↔', weight:22 }, // 加宽挡板
    { type:'life',  color:'#ff6b8b', label:'♥', weight:22 }, // 加一条命
  ];
  function maybeDropPower(x, y) {
    if (Math.random() < 0.26) {
      const total = POWER_TYPES.reduce((s,p)=>s+p.weight, 0);
      let r = Math.random()*total, pick = POWER_TYPES[0];
      for (const p of POWER_TYPES) { r -= p.weight; if (r <= 0) { pick = p; break; } }
      powerups.push({ x: x-13, y: y-13, w: 26, h: 26, vy: 2.4, type: pick.type, color: pick.color, label: pick.label });
    }
  }
  function applyPower(type) {
    if (type === 'multi') {
      const base = balls.slice();
      const add = [];
      for (const b of base) {
        if (balls.length + add.length >= 16) break; // 上限，避免太多
        const ang = Math.atan2(b.vy, b.vx);
        for (const off of [0.4, -0.4]) {
          const a = ang + off;
          add.push(makeBall(b.x, b.y, Math.cos(a)*BALL_SPEED, Math.sin(a)*BALL_SPEED));
        }
      }
      balls.push(...add);
      beep(700, 0.12, 'sine', 0.06);
    } else if (type === 'mega') {
      const base = balls.slice();
      const add = [];
      for (const b of base) {
        if (balls.length + add.length >= 16) break; // 上限，避免太多
        const ang = Math.atan2(b.vy, b.vx);
        for (const off of [-0.5, -0.25, 0.25, 0.5]) { // 5 向散射
          if (balls.length + add.length >= 16) break;
          const a = ang + off;
          add.push(makeBall(b.x, b.y, Math.cos(a)*BALL_SPEED, Math.sin(a)*BALL_SPEED));
        }
      }
      balls.push(...add);
      beep(780, 0.14, 'sine', 0.06);
    } else if (type === 'wide') {
      paddle.w = Math.min(200, paddle.w + 40);
      paddleWideUntil = performance.now() + 12000;
      beep(620, 0.1, 'sine', 0.05);
    } else if (type === 'life') {
      lives = Math.min(5, lives + 1);
      updateHUD();
      beep(540, 0.12, 'sine', 0.05);
    }
  }

  function buildBricks() {
    bricks = [];
    const sideW = brickCfg.sideW, top = brickCfg.top, gap = brickCfg.gap;
    const bottomLimit = paddle.y - 70;               // 给挡板留出空间
    // 关卡越高，行列越多 -> 砖块数量更多
    let cols = brickCfg.cols + 2*(level - 1);
    let rows = 5 + 2*(level - 1);
    // 设定最小可读尺寸，反推行列上限，避免小到看不见
    const minW = 16, minH = 11;
    const maxCols = Math.floor((W - 2*sideW + gap) / (minW + gap));
    const maxRows = Math.floor((bottomLimit - top + gap) / (minH + gap));
    cols = Math.min(cols, maxCols);
    rows = Math.min(rows, maxRows);
    // 砖块随关卡变窄；高度先保持正常，行数过多时再缩小
    const bw = (W - 2*sideW - gap*(cols-1)) / cols;
    const baseH = 22;
    const bh = Math.min(baseH, (bottomLimit - top - gap*(rows-1)) / rows);
    let attempts = 0;
    do {
      bricks = [];
      for (let r=0; r<rows; r++) {
        for (let c=0; c<cols; c++) {
          if (Math.random() < 0.12) continue; // 随机留空 -> 分布不那么整齐
          const jitter = (Math.random()*2-1) * (gap*0.4); // 水平微抖动
          const hp = (r === 0 && level >= 2 && Math.random() < 0.4) ? 2 : 1;
          bricks.push({
            x: sideW + c*(bw+gap) + jitter,
            y: top + r*(bh+gap),
            w: bw, h: bh,
            hp, maxHp: hp,
            color: palette[(r*3 + c + Math.floor(Math.random()*3)) % palette.length],
            alive: true
          });
        }
      }
      attempts++;
    } while (bricks.length < 12 && attempts < 25);
    powerups.length = 0;
  }

  // ---------- 粒子 ----------
  let particles = [];
  function burst(x, y, color) {
    for (let i=0; i<10; i++) {
      const a = Math.random()*Math.PI*2;
      const s = 1 + Math.random()*3;
      particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, color });
    }
  }

  // ---------- 输入 ----------
  const keys = {};
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    keys[e.key] = true;
    if (e.key === ' ') { if (state===STATE.READY) launch(); }
    if (e.key === 'p' || e.key === 'P') {
      if (state===STATE.PLAY) state = STATE.PAUSE;
      else if (state===STATE.PAUSE) state = STATE.PLAY;
    }
  });
  document.addEventListener('keyup', e => { keys[e.key] = false; });

  // 监听挂到 window：鼠标在窗口内任何位置都能控挡板，移出画布也不会冻结
  window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W/rect.width);
    paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w/2));
  });
  canvas.addEventListener('click', () => { if (state===STATE.READY) launch(); });

  // ---------- 手机触屏 ----------
  function touchX(e) {
    const rect = canvas.getBoundingClientRect();
    return (e.touches[0].clientX - rect.left) * (W/rect.width);
  }
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (state===STATE.READY) launch();
    const tx = touchX(e);
    paddle.x = Math.max(0, Math.min(W - paddle.w, tx - paddle.w/2));
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const tx = touchX(e);
    paddle.x = Math.max(0, Math.min(W - paddle.w, tx - paddle.w/2));
  }, { passive: false });

  function launch() {
    const ang = (-Math.PI/2) + (Math.random()*0.5 - 0.25); // 大致向上
    const b = balls[0];
    b.vx = Math.cos(ang) * BALL_SPEED;
    b.vy = Math.sin(ang) * BALL_SPEED;
    state = STATE.PLAY;
    beep(440, 0.08, 'triangle');
  }

  // ---------- 流程 ----------
  function resetBall() {
    balls = [ makeBall(paddle.x + paddle.w/2, paddle.y - BALL_R - 2, 0, 0) ];
    state = STATE.READY;
  }

  function startGame() {
    score = 0; level = 1; lives = 3;
    buildBricks();
    resetBall();
    overlay.classList.add('hidden');
    updateHUD();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function nextLevel() {
    level++;
    buildBricks();
    resetBall();
    updateHUD();
  }

  function loseLife() {
    lives--;
    updateHUD();
    beep(160, 0.25, 'sawtooth', 0.06);
    if (lives <= 0) {
      state = STATE.OVER;
      showOverlay('游戏结束', `最终得分 <span class="big">${score}</span><br>到达关卡 ${level}`, '再 来 一 局');
    } else {
      resetBall();
    }
  }

  function updateHUD() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    livesEl.textContent = lives > 0 ? '♥'.repeat(lives) : '—';
  }

  function showOverlay(title, html, btn) {
    overlay.querySelector('h1').textContent = title;
    overlay.querySelector('p').innerHTML = html;
    startBtn.textContent = btn;
    overlay.classList.remove('hidden');
  }

  startBtn.addEventListener('click', () => {
    if (state === STATE.OVER || state === STATE.WIN || state === STATE.MENU) startGame();
  });

  // ---------- 碰撞 ----------
    function ballRectHit(b, br) {
    if (b.x - b.r < br.x + br.w && b.x + b.r > br.x &&
        b.y - b.r < br.y + br.h && b.y + b.r > br.y) {
      const overlapL = (b.x + b.r) - br.x;
      const overlapR = (br.x + br.w) - (b.x - b.r);
      const overlapT = (b.y + b.r) - br.y;
      const overlapB = (br.y + br.h) - (b.y - b.r);
      const minSide = Math.min(overlapL, overlapR, overlapT, overlapB);
      if (minSide === overlapT || minSide === overlapB) b.vy = -b.vy;
      else b.vx = -b.vx;
      if (minSide === overlapL) b.x = br.x - b.r - 1;
      else if (minSide === overlapR) b.x = br.x + br.w + b.r + 1;
      else if (minSide === overlapT) b.y = br.y - b.r - 1;
      else b.y = br.y + br.h + b.r + 1;
      return true;
    }
    return false;
  }

  // ---------- 主循环 ----------
  // dt: 归一化时间系数，约 1 表示 60fps 正常速度；掉帧时仍能保持同一视觉速度
  function update(dt) {
    if (state === STATE.PLAY) {
      // 挡板键盘控制
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed * dt;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed * dt;
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

      // 道具计时（加宽恢复）
      if (paddleWideUntil && performance.now() > paddleWideUntil) {
        paddle.w = PADDLE_W_BASE;
        paddleWideUntil = 0;
      }

      // 小球更新（支持多球）
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];
        b.trail.push({x: b.x, y: b.y});
        if (b.trail.length > 12) b.trail.shift();

        b.x += b.vx * dt;
        b.y += b.vy * dt;

        // 墙壁
        if (b.x - b.r < 0) { b.x = b.r; b.vx *= -1; beep(520,0.04); }
        if (b.x + b.r > W) { b.x = W - b.r; b.vx *= -1; beep(520,0.04); }
        if (b.y - b.r < 0) { b.y = b.r; b.vy *= -1; beep(520,0.04); }

        // 掉落
        if (b.y - b.r > H) { balls.splice(i,1); continue; }

        // 挡板碰撞
        if (b.vy > 0 &&
            b.y + b.r >= paddle.y && b.y + b.r <= paddle.y + paddle.h + 8 &&
            b.x >= paddle.x && b.x <= paddle.x + paddle.w) {
          const hit = (b.x - (paddle.x + paddle.w/2)) / (paddle.w/2); // -1..1
          const ang = (-Math.PI/2) + hit * (Math.PI/3); // 反弹角
          b.vx = Math.cos(ang) * b.speed;
          b.vy = Math.sin(ang) * b.speed;
          b.y = paddle.y - b.r - 1;
          beep(660, 0.05, 'triangle');
        }

        // 方块碰撞
        for (const br of bricks) {
          if (!br.alive) continue;
          if (ballRectHit(b, br)) {
            br.hp--;
            beep(br.hp>0?330:480, 0.05, 'square', 0.04);
            if (br.hp <= 0) {
              br.alive = false;
              score += 10 * level;
              burst(br.x + br.w/2, br.y + br.h/2, br.color);
              maybeDropPower(br.x + br.w/2, br.y + br.h/2);
              updateHUD();
            }
            break; // 每帧只处理一次碰撞
          }
        }
      }

      // 全部小球掉落 -> 失命
      if (balls.length === 0) { loseLife(); return; }

      // 道具下落与接取
      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += p.vy * dt;
        if (p.y + p.h >= paddle.y && p.y <= paddle.y + paddle.h &&
            p.x + p.w >= paddle.x && p.x <= paddle.x + paddle.w) {
          applyPower(p.type);
          powerups.splice(i, 1);
          continue;
        }
        if (p.y > H) powerups.splice(i, 1);
      }

      // 通关判定
      if (bricks.every(b => !b.alive)) {
        if (level >= 8) {
          state = STATE.WIN;
          showOverlay('🏆 通关啦', `你打穿了全部关卡！<br>最终得分 <span class="big">${score}</span>`, '再 玩 一 次');
        } else {
          nextLevel();
        }
      }
    }

    // 粒子
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.05 * dt; p.life -= 0.03 * dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  // ---------- 渲染 ----------
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 背景网格微光
    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.strokeStyle = '#5ad1ff';
    ctx.lineWidth = 1;
    for (let i=0; i<W; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
    for (let j=0; j<H; j+=40) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(W,j); ctx.stroke(); }
    ctx.restore();

    // 方块
    for (const b of bricks) {
      if (!b.alive) continue;
      ctx.save();
      if (b.hp < b.maxHp) ctx.globalAlpha = 0.55;
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, b.w, b.h, 6);
      ctx.fill();
      // 高光
      ctx.globalAlpha = (b.hp < b.maxHp ? 0.55 : 1) * 0.25;
      ctx.fillStyle = '#ffffff';
      roundRect(b.x+3, b.y+3, b.w-6, b.h*0.35, 4);
      ctx.fill();
      ctx.restore();
    }

    // 粒子
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // 小球轨迹 + 小球（支持多球）
    for (const b of balls) {
      for (let i=0; i<b.trail.length; i++) {
        const t = b.trail[i];
        ctx.save();
        ctx.globalAlpha = (i/b.trail.length) * 0.4;
        ctx.fillStyle = '#9fe8ff';
        ctx.beginPath();
        ctx.arc(t.x, t.y, b.r * (i/b.trail.length), 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
      ctx.save();
      // 球多时关掉逐球阴影，避免 shadowBlur 拖垮帧率（这是卡顿主因之一）
      if (balls.length <= 8) { ctx.shadowBlur = 18; ctx.shadowColor = '#9fe8ff'; }
      ctx.fillStyle = '#eaf6ff';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // 道具
    for (const p of powerups) {
      ctx.save();
      ctx.shadowBlur = 12; ctx.shadowColor = p.color;
      ctx.fillStyle = p.color;
      roundRect(p.x, p.y, p.w, p.h, 7);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#06121f';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.label, p.x + p.w/2, p.y + p.h/2 + 1);
      ctx.restore();
    }

    // 挡板
    ctx.save();
    ctx.shadowBlur = 14; ctx.shadowColor = paddle.color;
    const grad = ctx.createLinearGradient(paddle.x, 0, paddle.x+paddle.w, 0);
    grad.addColorStop(0, '#56d6ff'); grad.addColorStop(1, '#8a7bff');
    ctx.fillStyle = grad;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 8);
    ctx.fill();
    ctx.restore();

    // 准备发射提示
    if (state === STATE.READY) {
      ctx.save();
      ctx.fillStyle = 'rgba(200,220,255,0.85)';
      ctx.font = '15px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('点击屏幕 / 空格 发射小球', W/2, paddle.y - 30);
      ctx.restore();
    }
    if (state === STATE.PAUSE) {
      ctx.save();
      ctx.fillStyle = 'rgba(6,10,22,0.6)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#e8eefc';
      ctx.font = '34px "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⏸ 已暂停', W/2, H/2);
      ctx.restore();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  // 用真实帧间隔归一化，避免掉帧时球速忽快忽慢；切后台回来时限制最大 dt 防穿模
  let lastTime = performance.now();
  function loop(now) {
    const t = (now !== undefined) ? now : performance.now();
    const dtMs = Math.min(t - lastTime, 33);   // 上限 33ms，避免大卡顿后瞬移穿模
    lastTime = t;
    const dt = dtMs / (1000 / 60); // 60fps 时约为 1
    beepBudget = 4;                 // 每帧重置音效预算
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
